<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Memory Game</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f2f2f2;
}

#login {
  margin-top: 100px;
}

input {
  padding: 10px;
  font-size: 18px;
}

button {
  padding: 10px 20px;
  font-size: 18px;
  margin-top: 10px;
  cursor: pointer;
}

.board {
  display: grid;
  grid-template-columns: repeat(4, 80px);
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
  display: none;
}

.card {
  width: 80px;
  height: 80px;
  background: #4CAF50;
  color: white;
  font-size: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  border-radius: 10px;
}

.card.flipped {
  background: white;
  color: black;
}

.info {
  display: none;
  margin-top: 10px;
}

.win {
  margin-top: 15px;
  font-size: 22px;
  color: green;
}
</style>
</head>

<body>

<!-- 👤 ВХОД -->
<div id="login">
  <h2>🎮 Въведи име</h2>
  <input id="name" placeholder="Име..." />
  <br>
  <button onclick="start()">Играй</button>
</div>

<!-- 📊 ИНФО -->
<div class="info" id="info">
  👤 Играч: <span id="player"></span> |
  ⏱ Време: <span id="time">0</span> |
  🎯 Ходове: <span id="moves">0</span>
</div>

<!-- 🎮 ИГРА -->
<div class="board" id="board"></div>

<div class="win" id="win"></div>

<script>
let playerName = "";

function start() {
  const name = document.getElementById("name").value;

  if (name === "") {
    alert("Въведи име!");
    return;
  }

  playerName = name;

  document.getElementById("login").style.display = "none";
  document.getElementById("info").style.display = "block";
  document.getElementById("board").style.display = "grid";

  document.getElementById("player").textContent = playerName;

  initGame();
}

// 🎮 играта
function initGame() {

  const emojis = ["🍎","🍌","🍇","🍉","🍒","🍑","🍍","🥝"];
  let cards = [...emojis, ...emojis];
  cards.sort(() => Math.random() - 0.5);

  const board = document.getElementById("board");
  const timeEl = document.getElementById("time");
  const movesEl = document.getElementById("moves");
  const winEl = document.getElementById("win");

  let first = null;
  let second = null;
  let lock = false;
  let moves = 0;
  let matched = 0;
  let time = 0;

  setInterval(() => {
    time++;
    timeEl.textContent = time;
  }, 1000);

  cards.forEach(emoji => {
    const card = document.createElement("div");
    card.className = "card";
    card.textContent = "";

    card.dataset.emoji = emoji;

    card.addEventListener("click", () => {
      if (lock || card.classList.contains("flipped")) return;

      card.classList.add("flipped");
      card.textContent = emoji;

      if (!first) {
        first = card;
      } else {
        second = card;
        lock = true;

        moves++;
        movesEl.textContent = moves;

        if (first.dataset.emoji === second.dataset.emoji) {
          matched += 2;
          first = null;
          second = null;
          lock = false;

          if (matched === cards.length) {
            winEl.textContent = "🎉 Победи " + playerName + "!";
          }

        } else {
          setTimeout(() => {
            first.classList.remove("flipped");
            second.classList.remove("flipped");
            first.textContent = "";
            second.textContent = "";
            first = null;
            second = null;
            lock = false;
          }, 700);
        }
      }
    });

    board.appendChild(card);
  });
}
</script>

</body>
</html>
