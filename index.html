<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Игри.com</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f0f0f0;
  text-align: center;
}

header {
  background: #222;
  color: white;
  padding: 15px;
  font-size: 24px;
}

nav {
  background: #444;
  padding: 10px;
}

nav button {
  margin: 5px;
  padding: 10px;
  border: none;
  background: #666;
  color: white;
  cursor: pointer;
}

section {
  display: none;
  padding: 20px;
}

.active {
  display: block;
}

input {
  padding: 8px;
  margin: 5px;
  width: 200px;
}

.card {
  width: 60px;
  height: 60px;
  background: gray;
  display: inline-block;
  margin: 5px;
  font-size: 30px;
  line-height: 60px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>Игри.com 🎮</header>

<section id="вход" class="active">
<h2>Вход</h2>

<p>Имейл адрес:</p>
<input type="text"><br>

<p>Парола:</p>
<input type="password"><br>

<p style="color:blue; cursor:pointer;">Забравена парола?</p>
<p>Нямаш профил? <span style="color:blue;">Регистрирай се</span></p>

<button onclick="влез()">Влез</button>
</section>

<nav>
<button onclick="покажи('начало')">Начало</button>
<button onclick="покажи('игра')">Игра</button>
<button onclick="покажи('рекорди')">Рекорди</button>
</nav>

<section id="начало">
<h2>Начало</h2>
<p>Добре дошъл в Игри.com!</p>
</section>

<section id="игра">
<h2>Игра за памет</h2>
<div id="поле"></div>
<p id="резултат"></p>
</section>

<section id="рекорди">
<h2>Рекорди</h2>
<p id="найДобър">Няма рекорд</p>
</section>

<script>
function покажи(id) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function влез() {
  покажи('начало');
}

// ИГРА
let карти = ["🍎","🍎","🍌","🍌","🍇","🍇","🍒","🍒"];
карти.sort(() => 0.5 - Math.random());

let първа = null;
let втора = null;
let заключено = false;
let ходове = 0;

const поле = document.getElementById("поле");

карти.forEach(символ => {
  let карта = document.createElement("div");
  карта.className = "card";
  карта.dataset.стойност = символ;
  карта.onclick = () => обърни(карта);
  поле.appendChild(карта);
});

function обърни(карта) {
  if (заключено || карта.textContent) return;

  карта.textContent = карта.dataset.стойност;

  if (!първа) {
    първа = карта;
  } else {
    втора = карта;
    заключено = true;
    ходове++;

    if (първа.dataset.стойност === втора.dataset.стойност) {
      първа = null;
      втора = null;
      заключено = false;
      провери();
    } else {
      setTimeout(() => {
        първа.textContent = "";
        втора.textContent = "";
        първа = null;
        втора = null;
        заключено = false;
      }, 800);
    }
  }
}

function провери() {
  if ([...document.querySelectorAll(".card")].every(к => к.textContent)) {
    document.getElementById("резултат").textContent = "Победи за " + ходове + " хода!";

    let рекорд = localStorage.getItem("рекорд");
    if (!рекорд || ходове < рекорд) {
      localStorage.setItem("рекорд", ходове);
      document.getElementById("найДобър").textContent = "Най-добър: " + ходове;
    }
  }
}

let рекорд = localStorage.getItem("рекорд");
if (рекорд) {
  document.getElementById("найДобър").textContent = "Най-добър: " + рекорд;
}
</script>

</body>
</html>
