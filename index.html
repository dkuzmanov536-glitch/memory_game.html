<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Игри</title>

  <style>
    .fruit-box {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 300px;
      margin: auto;
      margin-top: 50px;
    }

    .fruit {
      aspect-ratio: 1 / 1;
      font-size: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      border: 2px solid #ccc;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1 style="text-align:center;">Плодове</h1>

  <div class="fruit-box" id="box"></div>

  <script>
    const fruits = ["🍎", "🍌", "🍇", "🍉", "🍒", "🍑"];

    const box = document.getElementById("box");

    fruits.forEach(fruit => {
      const div = document.createElement("div");
      div.className = "fruit";
      div.textContent = fruit;
      box.appendChild(div);
    });
  </script>

</body>
</html>
