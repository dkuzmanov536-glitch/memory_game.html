<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Игри.com</title>
<style>
body { font-family: Arial; text-align: center; margin: 0; }
nav { background: #333; padding: 10px; }
nav button { margin: 5px; padding: 10px; color: white; background: #555; border: none; cursor: pointer; }
section { display: none; padding: 20px; }
.active { display: block; }
.card { width: 60px; height: 60px; display: inline-block; margin: 5px;
        background: gray; font-size: 30px; line-height: 60px; cursor: pointer; }
</style>
</head>
<body>

<nav>
<button onclick="show('home')">Начало</button>
<button onclick="show('game')">Игри</button>
<button onclick="show('score')">Рекорди</button>
</nav>

<section id="home" class="active">
<h1>Добре дошъл в Игри.com 🎮</h1>
<p>Избери "Игри" за да започнеш!</p>
</section>

<section id="game">
<h2>Игра за памет 🃏</h2>
<div id="board"></div>
<p id="result"></p>
</section>

<section id="score">
<h2>Рекорди 🏆</h2>
<p id="best">Няма рекорд</p>
</section>

<script>
function show(id) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// MEMORY GAME
let cards = ["🍎","🍎","🍌","🍌","🍇","🍇","🍒","🍒"];
cards.sort(() => 0.5 - Math.random());

let first = null;
let second = null;
let lock = false;
let moves = 0;

const board = document.getElementById("board");

cards.forEach((emoji, i) => {
  let div = document.createElement("div");
  div.className = "card";
  div.dataset.value = emoji;
  div.onclick = () => flip(div);
  board.appendChild(div);
});

function flip(card) {
  if (lock || card.textContent) return;

  card.textContent = card.dataset.value;

  if (!first) {
    first = card;
  } else {
    second = card;
    lock = true;
    moves++;

    if (first.dataset.value === second.dataset.value) {
      first = second = null;
      lock = false;
      checkWin();
    } else {
      setTimeout(() => {
        first.textContent = "";
        second.textContent = "";
        first = second = null;
        lock = false;
      }, 800);
    }
  }
}

function checkWin() {
  if ([...document.querySelectorAll(".card")].every(c => c.textContent)) {
    document.getElementById("result").textContent = "Победи за " + moves + " хода!";
    
    let best = localStorage.getItem("best");
    if (!best || moves < best) {
      localStorage.setItem("best", moves);
      document.getElementById("best").textContent = "Най-добър: " + moves;
    }
  }
}

// LOAD SCORE
let best = localStorage.getItem("best");
if (best) {
  document.getElementById("best").textContent = "Най-добър: " + best;
}
</script>

</body>
</html>
