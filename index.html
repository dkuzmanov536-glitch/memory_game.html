<div class="fruit-box" id="box"></div>
<style>.fruit-box {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  width: 300px;
  margin: auto;
}

.fruit {
  aspect-ratio: 1 / 1;
  font-size: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  border: 2px solid #ccc;
  border-radius: 10px;
}<script>const fruits = ["🍎", "🍌", "🍇", "🍉", "🍒", "🍑"];

const box = document.getElementById("box");

fruits.forEach(fruit => {
  const div = document.createElement("div");
  div.className = "fruit";
  div.textContent = fruit;
  box.appendChild(div);
});
