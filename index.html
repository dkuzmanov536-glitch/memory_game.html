<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Memory Game</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f2f2f2;
}

h1 {
  margin-top: 15px;
}

.info {
  margin: 10px;
  font-size: 18px;
}

.board {
  display: grid;
  grid-template-columns: repeat(4, 80px);
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
}

.card {
  width: 80px;
  height: 80px;
  background: #4CAF50;
  color: white;
  font-size: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  border-radius: 10px;
  user-select: none;
}

.card.flipped {
  background: white;
  color: black;
}

.win {
  margin-top: 15px;
  font-size: 22px;
  color: green;
}
</style>
</head>

<body>

<h1>🧠 Memory Game</h1>

<div class="info">
⏱ Време: <span id="time">0</span> сек |
🎯 Ходове: <span id="moves">0</span>
</div>

<div class="board" id="board"></div>

<div class="win" id="win"></div>

<script>
const emojis = ["🍎","🍌","🍇","🍉","🍒","🍑","🍍","🥝"];
let cards = [...emojis, ...emojis];
cards.sort(() => Math.random() - 0.5);

const board = document.getElementById("board");
const timeEl = document.getElementById("time");
const movesEl = document.getElementById("moves");
const winEl = document.getElementById("win");

let first = null;
let second = null;
let lock = false;
let moves = 0;
let matched = 0;
let time = 0;
let started = false;

// ⏱ таймер
setInterval(() => {
  if (started) {
    time++;
    timeEl.textContent = time;
  }
}, 1000);

// създаване на карти
cards.forEach(emoji => {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.emoji = emoji;
  card.textContent = "";

  card.addEventListener("click", () => {
    if (lock || card.classList.contains("flipped")) return;

    if (!started) started = true;

    card.classList.add("flipped");
    card.textContent = emoji;

    if (!first) {
      first = card;
    } else {
      second = card;
      lock = true;
      moves++;
      movesEl.textContent = moves;

      if (first.dataset.emoji === second.dataset.emoji) {
        matched += 2;
        first = null;
        second = null;
        lock = false;

        if (matched === cards.length) {
          winEl.textContent = "🎉 Победи! Браво!";
          started = false;
        }

      } else {
        setTimeout(() => {
          first.classList.remove("flipped");
          second.classList.remove("flipped");
          first.textContent = "";
          second.textContent = "";
          first = null;
          second = null;
          lock = false;
        }, 700);
      }
    }
  });

  board.appendChild(card);
});
</script>

</body>
</html>
