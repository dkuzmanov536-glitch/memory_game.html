<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Игри</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  margin: 0;
  background: #f4f4f4;
}

nav {
  background: #222;
  padding: 10px;
}

nav button {
  margin: 5px;
  padding: 10px 15px;
  color: white;
  background: #444;
  border: none;
  cursor: pointer;
  border-radius: 8px;
}

nav button:hover {
  background: #666;
}

section {
  display: none;
  padding: 20px;
}

.active {
  display: block;
}

.card {
  width: 60px;
  height: 60px;
  display: inline-block;
  margin: 5px;
  background: #888;
  font-size: 30px;
  line-height: 60px;
  cursor: pointer;
  border-radius: 10px;
}

h1, h2 {
  color: #333;
}
</style>
</head>

<body>

<nav>
<button onclick="покажи('начало')">Начало</button>
<button onclick="покажи('игра')">Игри</button>
<button onclick="покажи('рекорди')">Рекорди</button>
</nav>

<section id="начало" class="active">
<h1>Добре дошъл 🎮</h1>
<p>Избери „Игри“, за да започнеш!</p>
</section>

<section id="игра">
<h2>Игра за памет 🧠</h2>
<div id="поле"></div>
<p id="резултат"></p>
</section>

<section id="рекорди">
<h2>Най-добри резултати 🏆</h2>
<p id="найДобър">Все още няма рекорд</p>
</section>

<script>
function покажи(име) {
  document.querySelectorAll("section").forEach(секция => секция.classList.remove("active"));
  document.getElementById(име).classList.add("active");
}

// ИГРА ЗА ПАМЕТ
let карти = ["🍎","🍎","🍌","🍌","🍇","🍇","🍒","🍒"];
карти.sort(() => 0.5 - Math.random());

let първа = null;
let втора = null;
let заключено = false;
let ходове = 0;

const поле = document.getElementById("поле");

карти.forEach((символ, индекс) => {
  let карта = document.createElement("div");
  карта.className = "card";
  карта.dataset.стойност = символ;
  карта.onclick = () => обърни(карта);
  поле.appendChild(карта);
});

function обърни(карта) {
  if (заключено || карта.textContent) return;

  карта.textContent = карта.dataset.стойност;

  if (!първа) {
    първа = карта;
  } else {
    втора = карта;
    заключено = true;
    ходове++;

    if (първа.dataset.стойност === втора.dataset.стойност) {
      първа = null;
      втора = null;
      заключено = false;
      провериПобеда();
    } else {
      setTimeout(() => {
        първа.textContent = "";
        втора.textContent = "";
        първа = null;
        втора = null;
        заключено = false;
      }, 800);
    }
  }
}

function провериПобеда() {
  if ([...document.querySelectorAll(".card")].every(к => к.textContent)) {
    document.getElementById("резултат").textContent = "Победи за " + ходове + " хода!";

    let найДобър = localStorage.getItem("рекорд");
    if (!найДобър || ходове < найДобър) {
      localStorage.setItem("рекорд", ходове);
      document.getElementById("найДобър").textContent = "Най-добър резултат: " + ходове;
    }
  }
}

// ЗАРЕЖДАНЕ НА РЕКОРДА
let найДобър = localStorage.getItem("рекорд");
if (найДобър) {
  document.getElementById("найДобър").textContent = "Най-добър резултат: " + найДобър;
}
</script>

</body>
</html>
